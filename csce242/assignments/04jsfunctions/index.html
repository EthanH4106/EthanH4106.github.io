<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Buttons, Functions, and More</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="content">
            <header id="main-header">
                <h1>Assignment 7</h1>
                <h3>Introduction to JavaScript</h3>
            </header>
            <main>
                <div class="columns">
                    <section class="column" id="speech-column">
                        <h3>Speech</h3>
                        <div id="speech-bubble">Hi!</div>
                    </section>

                    <section class="column" id="beverage-column">
                        <h3>Beverage</h3>
                        <div class="beverage-content">
                            <label for="beverage">Pick your morning beverage:</label>
                            <select id="beverage">
                                <option value="Coffee">Coffee</option>
                                <option value="Orange Juice">Orange Juice</option>
                                <option value="Tea">Tea</option>
                                <option value="Water">Water</option>
                            </select>

                            <p id="beverage-output"></p>
                        </div>
                    </section>

                    <section class="column" id="sticker-column">
                        <h3>Add a Sticker</h3>
                        <div id="sticker-container">
                            <img id="sun" src="images\sun6.png" alt="sun">

                            <span id="sticker">🌞</span>
                        </div>
                    </section>
                </div>
            </main>
            <footer>
                <p>&copy; Ethan Helms</p>
            </footer>
        </div>
        <script src="functions.js"></script>
    </body>
</html>
