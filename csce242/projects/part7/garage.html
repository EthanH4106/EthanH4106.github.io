<!DOCTYPE html>
<html>
    <head>
        <title>Project 5 - Full HTML and CSS</title>
        <link rel="stylesheet" href="garage.css">
    </head>
    <body>
        <div id="content">
            <header>
                <nav class="navbar">
                    <a href="homepage.html" class="logo">✇Autovault</a>

                    <div class="nav-links">
                        <a href="homepage.html">Home</a>
                        <a href="performance.html">Performance</a>
                        <a href="garage.html" class="active">Garage</a>
                        <a href="about.html">About</a>
                    </div>
                </nav>
            </header>
            <main>
                <section id="garage-banner">
                    <h2>The Autovault Garage</h2>
                    <div class="banner-text">
                        <p>Explore perfromance, classics, JDM, 
                            American muscle, and so much more!
                        </p>
                    </div>
                </section>

                <section id="garage-controls">
                    <div class="filter-section">
                        <h3>Filter By:</h3>
                        <div class="filter-links">
                        <a href="#" class="active" data-filter="all">All</a> |
                        <a href="#" data-filter="suv">SUV</a> |
                        <a href="#" data-filter="truck">Truck</a> |
                        <a href="#" data-filter="muscle">Muscle</a> |
                        <a href="#" data-filter="sport">Sport</a> |
                        <a href="#" data-filter="super">Super</a>
                        </div>
                    </div>

                    <div class="sort-section">
                        <label for="sort">Sort By:</label>
                        <select id="sort">
                            <option>Horse Power</option>
                            <option>Year</option>
                            <option>Make</option>
                            <option>Model</option>
                        </select>
                    </div>

                    <div class="search-section">
                        <input type="text" placeholder="Search Vehicles...">
                        <button type="button">Search Garage!</button>
                    </div>
                </section>

                <section id="garage-grid">
                    <!-- JavaScript populates this section -->
                </section>
            </main>
                <footer>
                    <div class="footer-links">
                        <a href="homepage.html">Home</a>
                        <a href="performance.html">Performance</a>
                        <a href="garage.html" class="active">Garage</a>
                        <a href="about.html">About</a>
                    </div>
            </footer>
            <script src="garage.js"></script>
        </div>
    </body>
</html>
